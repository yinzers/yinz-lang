why = "The `lifetimes` muted-hint domain (Informational category; opt-in only) shows scope annotations the compiler figures out automatically. Yinz v0.1 has no explicit scope-annotation surface. The M5 LSP protocol handler emits no hints. If value scopes stay fully implicit (possible per design/ownership.md), this entry remains protocol-only indefinitely."
ships_in = "TBD — may never ship if value scopes stay fully implicit"
