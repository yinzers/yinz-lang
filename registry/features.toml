# ---------------------------------------------------------------------------
# [[diagnostic_template]] — canonical WHAT/WHAT-INSTEAD/WHY text for
# reusable DiagnosticKind variants. Supports {placeholder} substitution.
# Required fields: kind_name, what_template, what_instead_template, why_template
# ---------------------------------------------------------------------------

[[diagnostic_template]]
kind_name = "TypeMismatch"
what_template = "Expected {expected} here."
what_instead_template = "Change the value so it matches {expected}."
why_template = "Yinz is strictly typed — every value must exactly match the expected type."

[[diagnostic_template]]
kind_name = "MutationOfConst"
what_template = "`{binding}` is declared `const` and cannot be changed."
what_instead_template = "Change `const {binding}` to `let {binding}` if you need to reassign it."
why_template = "`const` bindings are immutable — the compiler can optimize them more aggressively and they signal intent to readers."

[[diagnostic_template]]
kind_name = "NotDefined"
what_template = "`{name}` is not defined in this scope."
what_instead_template = "Check the spelling, or declare `{name}` before using it."
why_template = "Yinz requires every name to be declared before it's used."

[[diagnostic_template]]
kind_name = "MissingField"
what_template = "Missing required field `{field}` in the shape literal."
what_instead_template = "Add `{field}: <value>` to the shape literal."
why_template = "`shape` values must set every field — there are no defaults unless declared `hidden`. This ensures construction sites are explicit."

[[diagnostic_template]]
kind_name = "HiddenAccess"
what_template = "`{field}` is a hidden field — only accessible from within its declaring file."
what_instead_template = "Use the methods or functions provided by that file to access `{field}`."
why_template = "Hidden fields are an encapsulation boundary. Accessing them directly from outside the file would bypass the invariants the declaring file maintains."

[[diagnostic_template]]
kind_name = "ImportNotFound"
what_template = "Imported module `{path}` was not found."
what_instead_template = "Check that the path is correct (paths are root-relative, starting from the project's entry file)."
why_template = "Yinz import paths are root-relative, not relative to the current file."

[[diagnostic_template]]
kind_name = "Consumed"
what_template = "`{name}` was already given away and cannot be used again."
what_instead_template = "Use `.copy()` before giving a value away if you need to keep using it."
why_template = "Once a value is given (ownership transferred), the original binding no longer holds a valid value. Using it would be a use-after-move bug."

[[diagnostic_template]]
kind_name = "Borrowed"
what_template = "`{name}` is already borrowed and cannot be given or reassigned while the borrow is active."
what_instead_template = "End the borrow before giving or reassigning `{name}`."
why_template = "Only one mutable borrow of a value can exist at a time. This prevents data races and use-after-move bugs."

[[diagnostic_template]]
kind_name = "MissingReturn"
what_template = "This function does not return a value on all paths."
what_instead_template = "Add a `return` statement in every branch, or ensure the last expression is the return value."
why_template = "Every code path in a function that declares a return type must actually return a value of that type."

[[diagnostic_template]]
kind_name = "BannedKeyword"
what_template = "`{keyword}` is not a Yinz keyword."
what_instead_template = "{what_instead}"
why_template = "{why}"

[[diagnostic_template]]
kind_name = "UnusedImport"
what_template = "`{name}` is imported but never used."
what_instead_template = "Remove `{name}` from the import list, or use it somewhere in this file."
why_template = "Unused imports add noise — every import signals to readers that this file depends on that symbol."

# --- v0.2-M4 watch diagnostic templates ---

[[diagnostic_template]]
kind_name = "WatchNoYinzToml"
what_template = "`ynz watch` in project mode requires a `yinz.toml` at `{root}`."
what_instead_template = "Pass a single `.ynz` file instead (`ynz watch foo.ynz`), or create a `yinz.toml` project file at the directory root."
why_template = "Project mode discovers which `.ynz` files to watch by reading `yinz.toml`. Without it, the project boundary is undefined."

[[diagnostic_template]]
kind_name = "WatchChildSpawnFailed"
what_template = "The compiled binary `{binary}` could not be executed."
what_instead_template = "Check that the temp directory (`$TMPDIR`) has free space and execute permissions. Run `ls -la $TMPDIR` to verify."
why_template = "{reason}. The build succeeded but the resulting binary could not be started as a child process."

[[diagnostic_template]]
kind_name = "WatchFsWatcherInitFailed"
what_template = "`ynz watch` could not subscribe to `{path}`."
what_instead_template = "Check that the path exists and is readable. Run `ls {path}` to verify."
why_template = "{reason}. The file system watcher must be able to read the target path to deliver change events."

[[diagnostic_template]]
kind_name = "WatchRssHardStop"
what_template = "ynz watch hit {rss_mb}MB memory; this is the safety stop (ceiling: {threshold_mb}MB)."
what_instead_template = "Run `ynz watch {args}` to restart. If this happens frequently, set `YNZ_WATCH_REBUILD_AFTER=200` (default 500) to rebuild the compiler state more often."
why_template = "The watch daemon accumulates salsa cache over time. The periodic DB rebuild (every 500 rebuilds by default) normally keeps memory bounded, but long sessions with large projects may exceed the ceiling. Lowering `YNZ_WATCH_REBUILD_AFTER` releases cache more frequently."

[[diagnostic_template]]
kind_name = "WatchMemoryPollingUnavailable"
what_template = "ynz watch: memory polling is unavailable on this platform."
what_instead_template = "The memory hard-stop safety net (`YNZ_WATCH_MAX_RSS_MB`) is disabled for this session. Watch will continue running."
why_template = "The `memory-stats` crate could not read process RSS on this platform (rare — typically affects chroot environments without /proc). Without RSS polling, the Layer 3 hard-stop cannot fire. Layers 1 (LRU caps) and 2 (periodic DB rebuild) remain active."

