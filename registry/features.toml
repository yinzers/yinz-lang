substitute = "CPU-bound task routing is auto-inferred today: the compiler's whole-program may-block analysis already determines which functions can suspend, and a task whose call graph contains zero may-block calls is routed to the blocking thread pool automatically — no override syntax needed for the common case. The IDE muted hint at the spawn site shows the routing decision regardless of which pool gets picked."
