# ---------------------------------------------------------------------------
# [[muted_hint_domain]] — IDE inference domains per .claude/rules/inference.md.
# Required fields: domain, placement_category, description, example_source,
#                  example_hint_rendered
# placement_category: "Addition" | "Replacement" | "Informational"
# ---------------------------------------------------------------------------

[[muted_hint_domain]]
domain = "variable_type"
placement_category = "Addition"
description = "Shows the type the compiler figures out for a variable from its initializer expression"
example_source = "let x = 42"
example_hint_rendered = ": int (from 42)"

[[muted_hint_domain]]
domain = "function_param_type"
placement_category = "Addition"
description = "Shows the function parameter type the compiler figures out from the call-site argument"
example_source = "foo(x => x + 1)"
example_hint_rendered = ": int"

[[muted_hint_domain]]
domain = "ownership_call_site"
placement_category = "Informational"
description = "Shows the ownership modifier the compiler picks at a function call site; also fires at background call sites when .copy() arg exceeds 64 bytes to suggest .give instead"
example_source = "foo(player)"
example_hint_rendered = "share (read-only — matches foo's signature)"
# v0.3-M1 extension: fires at `background fn(largeStruct.copy)` call sites when
# estimated copy size > 64 bytes. LSP inlayHint handler: crates/ynz-lsp/src/inlay_hint.rs.
# Firing condition: BackgroundLargeStructCopy warning present at call site span.
triggers_on_background_call_site = true

[[muted_hint_domain]]
domain = "wait_points"
placement_category = "Addition"
description = "Shows the compiler-figured `wait` before calls to functions the transitive may-block analysis marks as suspending. Skipped where the user already wrote explicit `wait`. Reads the effective suspend set (local suspending names PLUS imported functions whose signature marks them as suspending) — the same set that drives codegen routing, so the hint and the binary always agree."
example_source = "sleep(100)"
example_hint_rendered = "wait  "
active_since = "v0.3-M3b"

[[muted_hint_domain]]
domain = "background_routing"
placement_category = "Informational"
description = "Shows which thread pool a `background` spawn routes to — I/O pool (for callees the may-block analysis marks as suspending) or CPU pool (for callees with no may-block calls in their call graph). Reads the same FunctionSig.suspends flag that drives codegen routing so the hint and the actual routing always agree."
example_source = "background process(order)"
example_hint_rendered = "// routed to I/O pool — calls sleep (may suspend)"
active_since = "v0.3-M3b"

# v0.3-M3d: CPU-group members of a parallel group show which other statement they run
# alongside. CPU members note the separate-core routing; I/O members note the overlap
# without the core detail (the I/O event loop handles them in one cooperative pass).
# Reads the same partition query codegen reads, so the hint and the binary always agree.
#
# v0.3-M3g: a single group can now MIX both kinds of member — a compute-heavy call spawned
# onto a separate core alongside a waiting call inline-polled on the event loop, both driven
# by one shared continuation (`admitted_fused_group`/`emit_fused_group_spawn_poll`). Each
# member's hint is tagged per its OWN kind (only the CPU member says "separate core"), never
# a single label for the whole mixed group.
[[muted_hint_domain]]
domain = "parallel_groups"
placement_category = "Informational"
description = "Shows which other statement this one runs at the same time as. CPU-bound calls run on a separate computing unit; I/O-bound calls overlap cooperatively — and a single group can mix both kinds of call, each tagged with its own kind of overlap. All are compiler decisions driven by the independence analysis — the same analysis that controls the actual parallel execution in the binary."
example_source = "let hits = crunchStat(2)"
example_hint_rendered = "// runs at the same time as line 12 — separate core"
hover_what = "These statements overlap because no data flows between them — neither one reads what the other writes, so the compiler runs them at the same time instead of one after the other. A group can mix a compute-heavy call (tagged \"separate core\") with a waiting call (no core tag) — they still overlap together, just through two different mechanisms under the hood."
hover_what_instead = "Write `wait` before the second call to force them to run in order — that resets the group, so the second statement waits for the first to finish."
hover_why = "The compiler matched these statements into one parallel group: the listed lines have no shared reads or writes, so running them together is safe and faster — that holds even when one statement is compute-heavy and another is waiting on something, since each runs through whichever mechanism fits it while still sharing the same group. Adding a `wait` (or any statement that depends on an earlier value) splits the group back into sequential order."
active_since = "v0.3-M3d"

[[muted_hint_domain]]
domain = "lifetimes"
placement_category = "Informational"
description = "Shows lifetimes the compiler tracks automatically (shown only on user request — usually noise)"
example_source = "function foo(x: string) -> string { x }"
example_hint_rendered = "'caller_scope"

[[muted_hint_domain]]
domain = "allocators"
placement_category = "Addition"
description = "Shows the allocator the compiler picks for a new value inside an arena scope"
example_source = "let temp = array<int>()"
example_hint_rendered = ".in(scratch) — current arena"

[[muted_hint_domain]]
domain = "copy_points"
placement_category = "Addition"
description = "Shows where a trivially-copyable value is implicitly copied at a call site"
example_source = "let n: int = 5"
example_hint_rendered = ".copy (8 bytes, trivially copyable)"

[[muted_hint_domain]]
domain = "array_to_fixed_promotion"
placement_category = "Replacement"
description = "Shows when the compiler promotes array<T> to fixed<T> because the value is never grown"
example_source = "let nums: array<int> = [1, 2, 3]"
example_hint_rendered = "// promoted to fixed<int, 3> — never grown"

[[muted_hint_domain]]
domain = "let_to_const_promotion"
placement_category = "Replacement"
description = "Shows when a let binding is effectively const because it is never reassigned, mutated, or lent"
example_source = "let count = 5"
example_hint_rendered = "// effectively const — never reassigned"

# v0.3-M4: shows the default capacity the compiler fills in for a `channel<T>()` construction with
# no explicit capacity argument. Addition category — the plain muted `64` renders inside the empty
# parens (same plain-text convention as every other Addition hint); the hover shows the capacity
# AND that it is the default (an explicit user-set capacity leaves nothing to add, so no hint
# fires there). Domain registered in Phase 1; the typeck hint-pass
# (ynz-typeck/src/inlay_hint_passes.rs channel_capacity_hints) and the LSP inlay wiring
# (crates/ynz-lsp/src/inlay_hint.rs) landed in Phase 5. Click-to-make-explicit writes `64` into
# the empty parens. The `64` here is prose data mirroring the ONE authoritative constant
# (`ynz_typeck::DEFAULT_CHANNEL_CAPACITY`); a parity test in crates/ynz-lsp/tests/inlay_hint.rs
# breaks loudly if this entry and the constant ever drift.
[[muted_hint_domain]]
domain = "channel_capacity"
placement_category = "Addition"
description = "Shows the default capacity (64) the compiler fills in for a `channel<T>()` construction with no explicit capacity argument"
example_source = "let ch: channel<int> = channel<int>()"
example_hint_rendered = "64"
hover_what = "This channel uses the default capacity of 64 — how many values it can hold before send() makes the producer wait."
hover_what_instead = "Write the capacity yourself to make it visible: channel<int>(64)."
hover_why = "64 is the locked default. A channel is always bounded, so send() makes a fast producer wait for a slow consumer instead of letting the buffer grow without limit."

# v0.3-M4 Phase 3: shows where the compiler shares a read-only value across a `background`
# boundary by reference-counting it (auto-`Arc`) instead of deep-copying it. Informational
# category — there is no typeable source form for "reference-count this" (it is a codegen
# choice, like `background_routing`), so the hint is a passive comment-style annotation and
# there is no click-to-make-explicit. The hover carries the reference-counting-has-cost
# CAUTION (IMP-no-function-coloring §Runtime item 4: "cautionary red-tinted styling because
# reference counting has cost"). The red-TINT visual is staged behind
# `[[deferred_tooling_feature]]` `auto-arc-cautionary-tint` (no per-hint tint path exists in
# ynz-lsp today); the teaching text below ships now and renders as a normal muted hint.
# The domain is REGISTERED here in Phase 3; LSP inlay-firing wiring waits on the auto-Arc
# codegen emission (`[[deferred_language_feature]]` `auto-arc-codegen-emission`) — the
# `channel_capacity` registered-not-yet-firing precedent (its wiring lands in P5).
[[muted_hint_domain]]
domain = "auto_arc"
placement_category = "Informational"
description = "Shows where the compiler shares a read-only value across a `background` boundary by reference-counting it (auto-Arc) instead of deep-copying it. A codegen choice with no typeable source form, so it is informational only; the hover carries the reference-counting-has-cost caution."
example_source = "background render(scene)"
example_hint_rendered = "// shared by reference count across tasks — read-only"
hover_what = "This value is shared with the background task by counting references to one copy, instead of making a separate deep copy for each task."
hover_what_instead = "There is nothing to write in source — the compiler picks this automatically when the value is only read across the boundary. If you need each task to change its own version, pass `.copy` so they get independent copies."
hover_why = "Reference counting is not free — each task that takes or drops a reference does a small atomic bump. The compiler only does this when the value is read-only across the boundary, where sharing one copy is cheaper than copying it for every task."

