substitute = "All builds are currently debug builds (unoptimized, full debug info). Release builds ship in v0.4 (or a later perf-focused slot)."
why = "The `--release` flag enables LLVM optimization passes, strips debug info, and hardens panic/overflow behavior. Dev builds are the default; release builds are opt-in for production deployments."
