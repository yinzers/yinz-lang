# ---------------------------------------------------------------------------
# [[diagnostic_template]] — canonical WHAT/WHAT-INSTEAD/WHY text for
# reusable DiagnosticKind variants. Supports {placeholder} substitution.
# Required fields: kind_name, what_template, what_instead_template, why_template
# ---------------------------------------------------------------------------

[[diagnostic_template]]
kind_name = "TypeMismatch"
what_template = "Expected {expected} here."
what_instead_template = "Change the value so it matches {expected}."
why_template = "Yinz is strictly typed — every value must exactly match the expected type."

[[diagnostic_template]]
kind_name = "MutationOfConst"
what_template = "`{binding}` is declared `const` and cannot be changed."
what_instead_template = "Change `const {binding}` to `let {binding}` if you need to reassign it."
why_template = "`const` bindings are immutable — the compiler can optimize them more aggressively and they signal intent to readers."

[[diagnostic_template]]
kind_name = "NotDefined"
what_template = "`{name}` is not defined in this scope."
what_instead_template = "Check the spelling, or declare `{name}` before using it."
why_template = "Yinz requires every name to be declared before it's used."

[[diagnostic_template]]
kind_name = "MissingField"
what_template = "Missing required field `{field}` in the shape literal."
what_instead_template = "Add `{field}: <value>` to the shape literal."
why_template = "`shape` values must set every field — there are no defaults unless declared `hidden`. This ensures construction sites are explicit."

[[diagnostic_template]]
kind_name = "HiddenAccess"
what_template = "`{field}` is a hidden field — only accessible from within its declaring file."
what_instead_template = "Use the methods or functions provided by that file to access `{field}`."
why_template = "Hidden fields are an encapsulation boundary. Accessing them directly from outside the file would bypass the invariants the declaring file maintains."

[[diagnostic_template]]
kind_name = "ImportNotFound"
what_template = "Imported module `{path}` was not found."
what_instead_template = "Check that the path is correct (paths are root-relative, starting from the project's entry file)."
why_template = "Yinz import paths are root-relative, not relative to the current file."

[[diagnostic_template]]
kind_name = "Consumed"
what_template = "`{name}` was already given away and cannot be used again."
what_instead_template = "Use `.copy()` before giving a value away if you need to keep using it."
why_template = "Once a value is given (ownership transferred), the original binding no longer holds a valid value. Using it would be a use-after-move bug."

[[diagnostic_template]]
kind_name = "Borrowed"
what_template = "`{name}` is already borrowed and cannot be given or reassigned while the borrow is active."
what_instead_template = "End the borrow before giving or reassigning `{name}`."
why_template = "Only one mutable borrow of a value can exist at a time. This prevents data races and use-after-move bugs."

[[diagnostic_template]]
kind_name = "MissingReturn"
what_template = "This function does not return a value on all paths."
what_instead_template = "Add a `return` statement in every branch, or ensure the last expression is the return value."
why_template = "Every code path in a function that declares a return type must actually return a value of that type."

[[diagnostic_template]]
kind_name = "BannedKeyword"
what_template = "`{keyword}` is not a Yinz keyword."
what_instead_template = "{what_instead}"
why_template = "{why}"

[[diagnostic_template]]
kind_name = "UnusedImport"
what_template = "`{name}` is imported but never used."
what_instead_template = "Remove `{name}` from the import list, or use it somewhere in this file."
why_template = "Unused imports add noise — every import signals to readers that this file depends on that symbol."

# --- v0.2-M4 watch diagnostic templates ---

[[diagnostic_template]]
kind_name = "WatchNoYinzToml"
what_template = "`ynz watch` in project mode requires a `yinz.toml` at `{root}`."
what_instead_template = "Pass a single `.ynz` file instead (`ynz watch foo.ynz`), or create a `yinz.toml` project file at the directory root."
why_template = "Project mode discovers which `.ynz` files to watch by reading `yinz.toml`. Without it, the project boundary is undefined."

[[diagnostic_template]]
kind_name = "WatchChildSpawnFailed"
what_template = "The compiled binary `{binary}` could not be executed."
what_instead_template = "Check that the temp directory (`$TMPDIR`) has free space and execute permissions. Run `ls -la $TMPDIR` to verify."
why_template = "{reason}. The build succeeded but the resulting binary could not be started as a child process."

[[diagnostic_template]]
kind_name = "WatchFsWatcherInitFailed"
what_template = "`ynz watch` could not subscribe to `{path}`."
what_instead_template = "Check that the path exists and is readable. Run `ls {path}` to verify."
why_template = "{reason}. The file system watcher must be able to read the target path to deliver change events."

[[diagnostic_template]]
kind_name = "WatchRssHardStop"
what_template = "ynz watch hit {rss_mb}MB memory; this is the safety stop (ceiling: {threshold_mb}MB)."
what_instead_template = "Run `ynz watch {args}` to restart. If this happens frequently, set `YNZ_WATCH_REBUILD_AFTER=200` (default 500) to rebuild the compiler state more often."
why_template = "The watch daemon accumulates salsa cache over time. The periodic DB rebuild (every 500 rebuilds by default) normally keeps memory bounded, but long sessions with large projects may exceed the ceiling. Lowering `YNZ_WATCH_REBUILD_AFTER` releases cache more frequently."

[[diagnostic_template]]
kind_name = "WatchMemoryPollingUnavailable"
what_template = "ynz watch: memory polling is unavailable on this platform."
what_instead_template = "The memory hard-stop safety net (`YNZ_WATCH_MAX_RSS_MB`) is disabled for this session. Watch will continue running."
why_template = "The `memory-stats` crate could not read process RSS on this platform (rare — typically affects chroot environments without /proc). Without RSS polling, the Layer 3 hard-stop cannot fire. Layers 1 (LRU caps) and 2 (periodic DB rebuild) remain active."

# v0.3-M1 concurrency safety diagnostic templates

[[diagnostic_template]]
kind_name = "LendAcrossThreadBoundary"
what_template = "Cannot use `background` with a function that mutates its arguments via `lend`."
what_instead_template = "Change the parameter to `give` (transfer ownership) or pass a copy: `background fn(value.copy)`."
why_template = "`background` runs this function outside the current scope. A `lend` borrow allows mutation through the borrow; if the value's owner reassigns or drops it concurrently, the background task's mutations would corrupt freed memory. Transfer ownership (`give`) or pass a copy so the background task owns its argument."

[[diagnostic_template]]
kind_name = "KernelModeRejectsBackground"
what_template = "`background` is not available in --kernel mode."
what_instead_template = "Remove the keyword or build without `--kernel`. Kernel-mode programs run without a scheduler runtime."
why_template = "The thread-pool runtime that powers `background` does not run in kernel mode. See design/future/no-runtime-mode.md for the kernel-mode contract."

[[diagnostic_template]]
kind_name = "KernelModeRejectsWait"
what_template = "`wait` is not available in --kernel mode."
what_instead_template = "Remove the keyword or build without `--kernel`. Kernel-mode programs run without a scheduler runtime."
why_template = "The thread-pool runtime that powers `wait` does not run in kernel mode. See design/future/no-runtime-mode.md for the kernel-mode contract."

[[diagnostic_template]]
kind_name = "BackgroundLargeStructCopy"
what_template = "Copying {size} bytes into a background task."
what_instead_template = "Pass ownership with `background fn(value.give)` if you don't need the value after. Click `.give` to apply."
why_template = "`.give` transfers ownership without copying. Auto-detection of unused-after-call ships in v0.3-M3; until then, the choice is yours to make explicit."

# v0.3-M2 Option-B deferral diagnostic templates

[[diagnostic_template]]
kind_name = "WaitInsideLoop"
what_template = "`wait` inside a loop is not supported yet."
what_instead_template = "Move the `wait` to a standalone function called inside the loop: `function step() -> nothing { wait sleep(100) }`, then call `step()` from the loop body."
why_template = "v0.3-M2 can only pause at the top level of a function or inside an `if` block. Pausing inside a loop requires saving and restoring the loop counter across the pause point — that transform ships in v0.3-M3a."

[[diagnostic_template]]
kind_name = "LocalCrossesWait"
what_template = "`{name}` is declared before a `wait` and used after — this is not supported yet."
what_instead_template = "Move `{name}` to a function parameter (parameters are preserved across pause points) or restructure so `{name}` is not needed after the `wait`."
why_template = "v0.3-M2 can only preserve function parameters across a `wait` point. Preserving a local binding across a suspension requires a frame-slot transform that ships in v0.3-M3a."

# v0.3-M2 wait-semantics teaching diagnostic templates

[[diagnostic_template]]
kind_name = "WaitOnNonMayBlockWarning"
what_template = "`wait` on a function that does not suspend — the `wait` has no effect."
what_instead_template = "Remove the `wait` keyword — call `{callee_name}({args})` directly."
why_template = "`wait` only has effect when the awaited expression can suspend (calls a may-block intrinsic or another function whose body contains `wait`). Currently, the callee is purely CPU-bound; the runtime semantics are identical with or without `wait`."

[[diagnostic_template]]
kind_name = "WaitOnNonCallExpression"
what_template = "`wait` must be followed by a function call."
what_instead_template = "Write `wait someFn()` to wait for `someFn` to complete."
why_template = "`wait` schedules a suspension point. It only applies to function calls whose result must be waited for."

# UnawaitedSleepAsync — RETIRED by v0.3-M2 Phase 6 (transitive inference model).
# Under the inference model, `sleep` without explicit `wait` is correct: the transitive
# may-block analysis marks the enclosing function as `suspends` and codegen emits the
# suspension automatically. This diagnostic_template is retained as a registry record
# for the forensic trail of the bridge-era design; it is NOT emitted by the compiler.
# NOTE: intrinsic was renamed sleepAsync→sleep at v0.3-M3a; this record uses the old name
# for historical accuracy only.
[[diagnostic_template]]
kind_name = "UnawaitedSleepAsync"
what_template = "`sleep(ms)` creates a sleep handle but discards it without waiting — the function returns immediately, the sleep never fires."
what_instead_template = "Write `wait sleep({ms})` to actually pause for `{ms}` milliseconds. Or use `sleepBlocking({ms})` for the blocking-sleep semantics if `wait` isn't appropriate here."
why_template = "`sleep` is a may-block intrinsic — calling it without `wait` constructs the sleep object then drops it. The `wait` keyword is the user-visible signal that a suspension point happens here."
retired_since = "v0.3-M2-Phase6"

# WaitRequiredOnStateMachineCall — RETIRED by v0.3-M2 Phase 6 (transitive inference model).
# Under the inference model, every suspending caller is itself a state machine and every
# suspending call is an inline-poll-yield. `wait` is never "required" — inference drives
# suspension. This template is retained for forensic history; NOT emitted by the compiler.
[[diagnostic_template]]
kind_name = "WaitRequiredOnStateMachineCall"
what_template = "`{callee_name}` may suspend (its body contains `wait`); calling it from another state-machine function without `wait` is not allowed in v0.3-M2."
what_instead_template = "Write `wait {callee_name}({args})` to suspend the caller at this call site."
why_template = "v0.3-M2 keeps the no-coloring promise via a sync bridge — but only for callers that aren't already state machines. State-machine-to-state-machine without `wait` would require auto-`wait` insertion that ships in v0.3-M3. Until then, the keyword must be explicit at these call sites only. M3 auto-insertion lifts this requirement with zero source change."
retired_since = "v0.3-M2-Phase6"

# Note: the can't-infer suspension diagnostic (cross-module and dynamic-dispatch cases in
# check.rs) uses per-site inline strings rather than a [[diagnostic_template]] entry.
# Both cases are context-specific dynamic messages (callee name, contract name vary per site)
# and the cross-module and dynamic-dispatch WHAT-INSTEAD texts differ, making a single
# reusable template misleading. Per feature-registry.md carve-out: per-site dynamic
# messages stay in code, not in the registry.

