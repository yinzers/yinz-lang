# --- free_fn: sleepBlocking (v0.3-M1, renamed from sleepMs at v0.3-M3a) ---
# Synchronous blocking sleep on the calling thread. Blocks the OS thread for the
# full duration — no scheduler involvement. Name intentionally signals its danger:
# blocking the thread prevents other tasks from running on that thread during the wait.
# Use `sleep` (yielding) when inside a suspending function — `sleepBlocking` with
# an explicit `wait` produces a "`wait` has no effect" warning because it does not
# pause the state machine; it blocks the thread instead.
# Lowers to ynz_thread_sleep_ms(ms: i64) in libynz_runtime.a.
[[primitive_intrinsic]]
name = "sleepBlocking"
kind = "free_fn"
param_types = ["int"]
return_type = "nothing"
since = "v0.3-M1"

# --- free_fn: sleep (v0.3-M2, renamed from sleepAsync at v0.3-M3a) ---
# Non-blocking (yielding) sleep. `wait sleep(ms)` suspends the calling function for ms
# milliseconds without blocking the OS thread — the thread is freed for other tasks
# during the suspension. Pairs with sleepBlocking (blocking sleep, v0.3-M1).
# Lowers to ynz_rt_async_sleep_create + ynz_rt_async_sleep_poll in libynz_runtime.a.
# May-block: TRUE — member of M2_MAY_BLOCK_INTRINSICS in crates/ynz-typeck/src/intrinsics.rs.
[[primitive_intrinsic]]
name = "sleep"
kind = "free_fn"
param_types = ["int"]
return_type = "nothing"
since = "v0.3-M2"

