# --- Sized float variants (ship in v2+ with GPU/embedded targets) ---
[[deferred_language_feature]]
name = "f32"
substitute = "Use `float` (f64) for floating-point math. Sized floats ship in v2+ for GPU and embedded work."
why = "Yinz keeps the numeric type system small in v0.1: `int` (i64), `float` (f64), `number` (decimal128). Sized variants add cognitive load without paying off for typical application code. They land with kernel-mode and embedded targets in v2+."
ships_in = "v2+"
design_doc = "design/mvp-scope.md"
triggers = "Writing `f32` or `f64` as a type annotation in Yinz source"

