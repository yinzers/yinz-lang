why = "Renaming an aliased re-export (the local binding is owned by the importing file, not the origin) has subtle semantics: renaming `Captain` in `entrypoint.ynz` should update every file that imports `Captain` from `entrypoint.ynz` but leave `services/crew.ynz` alone. Correct handling requires typeck to own local-re-export-binding metadata — not yet wired in v0.2-M5."
