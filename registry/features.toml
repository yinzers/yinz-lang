# ---------------------------------------------------------------------------
# [[lint_rule]] — Tier 3 lint rules per docs/internal/implementation/IMP-linting.md.
# Required fields: name, severity, description, what_template,
#                  what_instead_template, why_template, since, design_doc
# severity: "suggestion" (Tier 3 default, dismissable) | "warning" — NEVER "error"
#           (build.rs rejects "error": a lint is a teaching surface, not a gate).
# Templates support {placeholder} substitution (rendered by the firing site via
# ynz_registry::lint_rule_diagnostic_parts); {{ and }} are literal braces.
# The rule name is the LSP Diagnostic.code (kebab-case), so editors can group and
# dismiss by rule. Adding a rule = one TOML entry + one compiler firing site; the
# mechanism (schema, parser, typed constants, LSP seam) needs zero changes —
# v0.3-M5's `array-using-soa-layout` lands as exactly that.
# ---------------------------------------------------------------------------

# v0.3-M4 Phase 4: fires when the false-sharing auto-padding transform (codegen-only,
# no muted hint — no typeable form exists) detects cross-task field access on a shape
# it cannot pad. In v0.3 the unpaddable class is layout-visible-outside-this-file:
# exported shapes, imported shapes, and structurally-named inline shapes — each file
# compiles to its own object file, so a shape another file can see must keep one layout.
[[lint_rule]]
name = "cross-thread-fields-not-padded"
severity = "suggestion"
description = "Fields of this shape are used by different background tasks, but the compiler cannot add cache-line padding because the shape's memory layout is visible outside this file."
what_template = "Fields of `{shape}` are used by different background tasks, but the compiler could not add cache-line padding to it."
what_instead_template = "Keep hot cross-task state in a shape declared in this file and not exported — the compiler pads that kind automatically. Or leave `{shape}` as is and accept the slower shared access."
why_template = "`{shape}`'s memory layout must be identical in every file that uses it ({reason}), and files compile separately — so the compiler cannot re-arrange it here. Without padding, two tasks writing neighboring fields share one 64-byte block of processor memory (a cache line): every write by one task forces the other task's processor core to re-fetch that block, measured around 3x slower on real workloads."
since = "v0.3-M4"
design_doc = "docs/internal/implementation/IMP-no-function-coloring.md"

# v0.3-M4 Phase 4: suggests the yielding sleep in non-kernel programs. Dismissable and
# NEVER an error — rare legitimate blocking-sleep uses exist and explicit intent is
# respected (auto-promotion.md "When NOT to auto-promote"). Does not fire in --kernel
# mode, where there is no scheduler to yield to and sleepBlocking is the RIGHT call.
[[lint_rule]]
name = "prefer-yielding-sleep"
severity = "suggestion"
description = "Suggests the yielding `wait sleep(ms)` over `sleepBlocking(ms)` in programs that have a scheduler — blocking sleep holds an OS thread idle."
what_template = "`sleepBlocking` parks the current thread — it sits idle and runs nothing else until the time is up."
what_instead_template = "Write `wait sleep({ms})` — your function pauses just the same, but the thread stays free to run other tasks. Keep `sleepBlocking` only when you truly need to hold the thread itself."
why_template = "This program runs on a scheduler that can run other tasks while one waits. `wait sleep` hands the thread back to the scheduler during the pause; `sleepBlocking` keeps the thread parked doing nothing. The blocking form is the right tool only where there is no scheduler to yield to (kernel mode)."
since = "v0.3-M4"
design_doc = "docs/internal/implementation/IMP-no-function-coloring.md"

# v0.3-M5 Phase 7: fires when the one layout authority (`layout_decisions_query`)
# applies the per-field array layout to an admitted `array<Shape>` binding; anchored
# on the array's declaration. The rule NAME is roadmap-locked (plan decision D9):
# "soa" is a registry-internal identifier convention, never user-facing text — all
# hover/template prose below stays jargon-free ("separate per-field arrays").
# Deliberately NO [[muted_hint_domain]] sibling: this layout has no typeable source
# form, so per auto-promotion.md / inference.md the muted-hint protocol does not
# apply (plan Divergence 5 — considered and correctly omitted, not forgotten).
# The WHY cites the honest Phase 6 measurement (crates/ynz-driver/benches/
# soa-threshold-raw-2026-07-04.md): ~1.0x measured at the OLD OptimizationLevel::None
# default, ~3.3x under the LLVM -O2 pass pipeline `ynz build` now runs by default as
# of v0.3-M7 — never conflated; the why_template below reflects the shipped v0.3-M7
# reality, not the pre-M7 baseline this historical note preserves.
[[lint_rule]]
name = "array-using-soa-layout"
severity = "suggestion"
description = "A large, never-grown array of shape values whose hot loops read at most two fields is stored as separate per-field arrays (one memory block per field). A compiler layout choice with no typeable source form; program behavior is identical."
what_template = "`{array}` is stored as separate per-field arrays: one block of memory per `{shape}` field, instead of each element's fields sitting side by side."
what_instead_template = "Nothing to change — there is no source form for this layout, and the program behaves exactly the same in both layouts. If this array's use changes (it grows, leaves this function, or its loops read more than two fields), the compiler quietly returns to the normal side-by-side layout."
why_template = "The hot loops over `{array}` ({len} `{shape}` values) read only {fields}, so grouping each field's values together lets those loops load just the bytes they use. Honest measurement: under the optimizer the compiler now runs by default, this layout measured about 1.49x faster on a comparable large loop of this shape — a real, shipped speedup, not a projected one. The layout costs nothing in correctness, and the speedup is already in the binaries `ynz build` produces today."
since = "v0.3-M5"
design_doc = "docs/internal/implementation/IMP-collections.md"
