# --- Nested-shape crossing a wait (docs/internal/implementation/IMP-concurrency.md M3a scope) ---
[[deferred_language_feature]]
name = "nested-shape-crossing-wait"
substitute = "Flatten the nested shape into primitive fields, or store the outer shape as a non-crossing local (assign it entirely after the last suspension in the function)."
why = "The frame-embed codegen copies the outer shape's bytes into the composed heap frame at suspension time. Nested shape fields are opaque pointers — the recursive memcpy that would copy the inner shape's bytes is not yet implemented. The fix requires extending frame layout to recursively embed all nested shape bytes (1-2 sessions of work)."
ships_in = "v0.3+"
design_doc = "docs/internal/implementation/IMP-concurrency.md"
triggers = "A `let` binding whose type is a shape with nested-shape fields, where that binding is read after a `wait` suspension in the same function"

# --- Shadowing a crossing local — same name re-used around a suspension (docs/internal/implementation/IMP-concurrency.md M3a scope) ---
[[deferred_language_feature]]
name = "shadow-crossing-local-support"
substitute = "Rename the colliding binding to a distinct name (e.g. `innerX` instead of `x`, or `xAfter` for a post-wait rebinding). Two values with different semantics should have different names anyway — the rename produces clearer code."
why = "The frame-slot system keys crossing-local slots by name (one slot per name). Two bindings with the same name around a suspension share one slot — the second write silently clobbers the first. The guard is deliberately conservative: it rejects all same-name re-uses around a suspension, including cases where reads might not reach the clobbered value, because the alternative is a silent wrong answer. Lifting this requires per-binding slot identity: each `let` declaration gets a unique ID, and flush/reload use that ID instead of the name. This is 1-2 sessions of work in the crossing analysis, frame layout, and codegen layers."
ships_in = "v0.3+"
design_doc = "docs/internal/implementation/IMP-concurrency.md"
triggers = "Two cases both trigger the error: (1) a `let x` inside a nested scope (if/while/for/match body) when an outer `let x` declared before a `wait` is read after the `wait` at the outer scope; (2) a second top-level `let x` in the function body after a suspension when a first top-level `let x` was declared before the suspension. Both produce a silent slot-collision miscompile if allowed. Parameters count as an outer binding for both shapes."

# --- Wide-value shape returns from suspending functions (docs/internal/implementation/IMP-concurrency.md) ---
# Note: `-> number errors` (decimal128 EC) is SUPPORTED as of M3a Phase 1 — a 16-byte
# staging slot in the composed frame stores the i128 and is freed with the frame (alloc=1/free=1).
# This entry covers only the remaining deferred cases: `-> Shape` and `-> Shape errors`.
[[deferred_language_feature]]
name = "wide-value-suspending-return"
substitute = "For `-> Shape`: return the shape's fields individually as primitives, or bind the shape to a crossing local and return a primitive derived from it. For `-> Shape errors`: return the shape's fields individually (e.g. `-> int errors`) or compute a primitive value inside the function and return that."
why = "Returning a Shape value from a suspending function needs a variable-size frame staging slot entangled with the pre-existing non-suspending shape-return base bug (shapes returned by value produce garbage for int fields even without suspension). Without it: `-> Shape` clobbers child sub-frames (staging bytes at FRAME_OFFSET_LOCALS_START=32 overwrites the sleep sub-frame's resume_point → SIGSEGV); `-> Shape errors` needs the same variable-size staging. The shape base bug must be fixed first. `-> number errors` is fully supported (16-byte fixed staging slot, alloc=1/free=1)."
ships_in = "v0.3+"
design_doc = "docs/internal/implementation/IMP-concurrency.md"
triggers = "A suspending function (one whose body contains a `wait`) whose return type is `Shape` or `Shape errors` — these trigger the WideValueSuspendingReturn compile error."

# --- union/maybe/dynamic crossing locals (docs/internal/implementation/IMP-concurrency.md) ---
[[deferred_language_feature]]
name = "unsupported-crossing-local-type"
substitute = "Extract the inner value before the `wait`, or restructure so the `union`, `maybe`, or `dynamic` value is not needed after the suspension."
why = "The frame-slot classifier in codegen handles int, bool, float, number, string, array, map, Shape, and ErrorsCapable crossing locals. `union`, `maybe<T>`, and `dynamic Contract` values are internally represented as pointers to {tag, payload} allocas on the resume function's stack — stack frames that are destroyed between suspension and resume. Flushing the alloca pointer to the frame and reloading it after resume produces undefined behavior (reading a dangling stack address). The UnsupportedCrossingLocalType guard in typeck/check.rs rejects these crossing locals at compile time, converting what was previously a raw LLVM ICE into a clean teaching diagnostic."
ships_in = "v0.3+"
design_doc = "docs/internal/implementation/IMP-concurrency.md"
triggers = "A local binding of type `union`, `maybe<T>`, or `dynamic Contract` that is declared before a `wait` and read after it — any of these triggers the UnsupportedCrossingLocalType compile error."

# --- EC wrapper collect-on-completion — SHIPPED in v0.3-M4 Phase 2. ---
# The deferred_language_feature entry (`ec-wrapper-collect-on-completion`) has been retired —
# the copy-before-free fix is live: a handle spawn (`let h = background worker()`) extracts the
# completion value from the frame's return slot BEFORE the frame is freed, copying a wide
# (`-> number errors`) ok-value to a handle-owned buffer; the bare fire-and-forget spawn path is
# byte-for-byte unchanged. Spawn-form-keyed at COMPILE time — never a runtime
# "was receive called" conditional. See docs/internal/implementation/IMP-concurrency.md
# ("ECWrapperResultCollection") and crates/ynz-runtime/src/handle.rs for the design record.

# --- Handle-drop cancel wiring (docs/internal/implementation/IMP-no-function-coloring.md "Task Cancellation") ---
[[deferred_language_feature]]
name = "background-handle-cancel-injection"
substitute = "In v0.3 a spawned task always runs to completion, even when its handle goes out of scope - it is never silently killed, and every channel/handle reference is refcount-guarded (no dangling reads, no double-free). To stop a long-running task on request, have it read a command channel (`h.send(...)` into the task's `channel<T>` parameter) and return when told."
why = "The locked cancel-via-drop model delivers a cancellation signal at the task's next suspension point, propagated as a normal `errors` value with every in-scope value cleaned up in order. The RUNTIME half exists and is proven: `ynz_handle_free` stops the child at its next suspension point, and the frame plus the handle-owned value buffer are each freed exactly once (substrate-tested). The LANGUAGE half - calling it automatically when a handle binding's scope ends, and surfacing the cancellation as a typed `errors` value inside the child - needs the language-wide automatic scope-cleanup mechanism, which does not exist in v0.3; wiring a handle-only cleanup pass now would create a second cleanup mechanism the general one would have to unify later. Until then a handle object is small, bounded (one per spawn), and reclaimed when the program ends."
ships_in = "v0.4+"
design_doc = "docs/internal/implementation/IMP-no-function-coloring.md"
triggers = "The language-wide automatic scope-cleanup mechanism shipping (`ynz_handle_free` is the ready-made runtime hook), OR a real workload needing to cancel a running task before then."

# --- Conduit-op expression position (v0.3-M4 Phase 2 statement discipline) ---
[[deferred_language_feature]]
name = "channel-op-expression-position"
substitute = "Bind the value first: `let value = ch.receive()` as its own statement, then use `value` inside the larger expression. Hold channels and task handles in named `let` bindings (or parameters) before calling `.send()`/`.receive()` on them."
why = "A channel operation can suspend the function mid-statement. The compiler resumes a suspended function at a statement boundary and saves NAMED bindings across the suspension; an operation nested inside a larger expression would need the surrounding expression's partial values - and an unnamed in-flight receiver - to survive the suspension, which requires expression-level temporaries to persist in the state-machine frame layout. The named-binding + statement-position discipline also keeps the early may-block analysis's syntactic view of channel/handle receivers exactly equivalent to the type-checker's view (the single-classifier discipline), so the two can never disagree about what suspends."
ships_in = "v0.4+"
design_doc = "docs/internal/implementation/IMP-no-function-coloring.md"
triggers = "`ch.receive() + 1`, `process(ch.receive())`, or `.send()`/`.receive()` on anything other than a plain named binding - each rejected today with a teaching error. Lift when expression-level temporaries can persist across suspension points in the state-machine frames."

# --- Handle form for never-suspending callees (v0.3-M4 Phase 2 restriction) ---
[[deferred_language_feature]]
name = "background-handle-nonsuspending-callee"
substitute = "Use fire-and-forget `background crunch(...)` for a CPU-bound function - it runs on the CPU pool and needs no handle. The handle form (`let h = background worker()`) works with any SUSPENDING function: one that uses `wait`, a channel, or calls a function that does."
why = "A handled task is an independent joinable task on the scheduler's cooperative pool, driving a suspend/resume state-machine frame - the substrate that `.send()`/`.receive()` and the completion delivery are built on. A function that never suspends has no state-machine frame: it runs to completion on the CPU (blocking) pool, whose join model is a run-once call with no conduit to collect from or send into. Bridging that (delivering a CPU-pool task's completed value through the same `.receive()` surface) is real design work on the CPU-pool join path, not a missing check."
ships_in = "v0.4+"
design_doc = "docs/internal/implementation/IMP-no-function-coloring.md"
triggers = "`let h = background crunch()` where `crunch` never suspends - rejected today with a teaching error that names this entry. Lift when the CPU-pool join path can deliver its completion through the handle's `.receive()` surface."

# --- Channel element-type restriction: per-type heap-upgrade (v0.3-M4 Phase 2 restriction) ---
[[deferred_language_feature]]
name = "channel-element-heap-upgrade"
substitute = "Use one of the supported element types: int, float, boolean, string, array<T>, map<K, V>. For a `shape`, send its fields as separate values (or pack them into an array or map) and rebuild the shape on the receiving side; the same field-wise pattern covers a `number` value. Alternatively, put the value in a heap-allocated container you manage (an `array<T>` of one element) and send that."
why = "Channel values travel between tasks as a single 64-bit slot: scalars by value (int, float, boolean) and heap-stable pointers (string, array, map). A `shape` or `number` value is backed by the SENDING task's stack frame, which can be freed while the value still sits in the channel - the receiver would read freed memory. This is the same dangling-pointer class the UnsupportedCrossingLocalType discipline (shipped in M3a) rejects for locals crossing a `wait`. Lifting the restriction needs a per-type heap-upgrade at the send site - copying the shape/number bytes into channel-owned heap storage the receiver frees after reading - which is real ABI + codegen work, not a missing check. Until it ships, these element types are rejected at channel construction with a clean teaching error, never a silent dangling read."
ships_in = "v0.4+"
design_doc = "docs/internal/implementation/IMP-concurrency.md"
triggers = "`channel<Player>()` or `channel<number>()` - any channel construction whose element type is a shape or `number` - rejected today with a teaching error (crates/ynz-typeck/src/check.rs, channel-construction element check). Lift when the per-type heap-upgrade (heap-copying sender-stack-backed values into channel-owned storage at the send site) ships."

# --- Sequential-consistency atomic-ordering opt-in (docs/internal/implementation/IMP-no-function-coloring.md "Atomic Ordering Default") ---
[[deferred_language_feature]]
name = "seq-cst-ordering-opt-in"
substitute = "Use the default acquire-release ordering, which is correct for every synchronization pattern that appears in v0.3-M4 user code: channel send/receive handoff and Arc reference counting. Sequential consistency (a global total order across multiple concurrent operations) is needed only for unusual multi-producer/multi-consumer patterns whose correctness contract depends on a global total order — rare even in systems code, and not expressible in v0.3."
why = "Yinz's channel and shared-state primitives use acquire-release ordering by default (cheaper on ARM, where seq-cst needs barriers on both loads and stores; essentially free on x86; correct for handoff/lock/refcount patterns per IMP-no-function-coloring 'Atomic Ordering Default'). The design doc reserves an explicit named opt-in for the rare global-total-order case (candidate `atomic.add(n).withGlobalOrdering()`, 'final naming TBD when concurrency primitives ship'). v0.3-M4 Phase 0 lock: DEFER the opt-in surface — no v0.3-M4 workload requires seq-cst, the naming is unresolved, and shipping an unused ordering-tunable now would surface memory-ordering jargon (Golden Rule 12) with no consumer. Acquire-release is the shipped default; the opt-in lands when a real workload needs it. The roadmap pre-authorizes this deferral."
ships_in = "v0.4+"
design_doc = "docs/internal/implementation/IMP-no-function-coloring.md"
triggers = "A real workload whose correctness contract requires a global total order across multiple concurrent atomic operations (seq-cst), OR the v0.4 concurrency-polish milestone — at which point the named opt-in surface (`.withGlobalOrdering()` or its final name) is designed and shipped."

# --- Auto-Arc CODEGEN EMISSION for read-only cross-`background` shared state ---
# (docs/internal/implementation/IMP-no-function-coloring.md §Runtime item 4)
#
# SURFACED to deviation-judge / conductor by the Phase 3 executor: the plan's Phase 3 exit
# criteria ("auto-Arc programs correct under repeated runs"; "alloc=free — Arc control
# blocks freed") assume the Arc codegen EMISSION ships this phase. It does NOT — and this is
# a scope deviation, not a silent skip. The SAFETY half of R3 (boundary exactness — the
# reject fires where it must, safe crossings are not falsely rejected, the generic
# silent-skip gap is closed, the channel exemption holds) ships and is build-blocking. The
# runtime SUBSTRATE (ynz-runtime/src/arc.rs: ynz_arc_new/clone/free, acquire-release
# refcount discipline, concurrency-hammer-tested) ships. Only the codegen that EMITS the
# Arc-wrap at the spawn site is deferred — see WHY.
[[deferred_language_feature]]
name = "auto-arc-codegen-emission"
substitute = "A read-only value shared across a `background` boundary crosses SAFELY today via the independent-copy path (the compiler infers `.copy` when the value is used after the spawn; the task reads its own copy, the caller keeps its own). This is correct and race-free — auto-Arc is a performance optimization of this exact crossing (refcount-share one copy instead of deep-copying per task), not a correctness fix. Nothing is unsafe in the meantime."
why = "Auto-Arc is an auto-promotion perf-form of the already-safe copy crossing (Golden Rule 10 'efficiency first'; the safe form already ships). A BENEFICIAL emission (Golden Rule 8 zero-cost: Arc must be cheaper than the copy it replaces, which only holds when one allocation is genuinely SHARED across the caller and/or multiple tasks) requires (a) a topology decision the design docs leave underspecified — IMP-no-function-coloring:58 points to IMP-ownership.md for the mechanism, but that doc does not actually specify it, and IMP-concurrency:189 locks `.share`-across-background as a hard error, so the caller/task sharing topology (repoint-caller-binding vs multi-task-share) is a design call, not an executor call — and (b) a SOUND read-only proof for the receiving callee, which the authoritative `ynz_typeck::effective_ownership` analysis (EffectiveOwnership::Reads) already provides and MUST be reused rather than re-deriving the fragile name-based mutation analysis that was built-and-removed for auto-parallel (IMP-concurrency:878, the authoritative-derivation.md corpse). A minimal single-task emission is a pessimization (adds an atomic + 8-byte header for zero sharing benefit), so there is no small sound-and-beneficial slice; shipping a speculative one risks R3's false-Arc silent data race (dormant override #3 class). The disciplined call: ship the safe boundary + substrate + teaching hint, defer the emission for a design decision on topology."
ships_in = "v0.4+"
design_doc = "docs/internal/implementation/IMP-no-function-coloring.md"
