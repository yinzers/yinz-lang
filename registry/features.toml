[[keyword]]
name = "wait"
token = "Wait"
since = "M8"
# Rule 11 hover docs — v0.3-M3b (ordering-barrier semantics locked 2026-06-05)
hover_what = "Forces this call to complete before execution continues. Also joins any prior auto-parallel in-flight work. Suspension at I/O points is automatic and does not require `wait`."
hover_what_instead = "Write `wait foo()` when `foo` must finish before the next statement runs AND the two operations are independent (different resources, no value threaded between them). For data-dependent calls, the compiler already orders them — `wait` is redundant."
hover_why = "`wait` is an ordering barrier, not a suspension trigger. The compiler auto-inserts suspension at every call that transitively reaches a blocking operation — you never write `wait` for that. `wait` is the tool for causal ordering the compiler cannot infer: charge a payment, THEN send a confirmation email to a different service."

[[keyword]]
name = "background"
token = "Background"
since = "M8"
# Rule 11 hover docs — v0.3-M3b (give/copy inference + real routing semantics)
hover_what = "Schedules a function to run as a concurrent task outside the current function's lifetime. The compiler infers whether to move or copy each argument based on whether you use it after the call."
hover_what_instead = "Write `background fn(value)` — the compiler picks `.give` (zero-copy move) when `value` is not used after, or `.copy` when it is. Write `background fn(value.give)` or `background fn(value.copy)` to be explicit. Functions whose parameter is `share` cannot be called via `background` — a shared borrow would dangle if the caller returns first."
hover_why = "A `background` task runs concurrently with whatever follows the call. Functions that transitively reach a blocking operation route to the I/O thread pool (cooperative scheduling); functions with no blocking calls route to the CPU thread pool. The IDE shows the routing decision as a muted comment at the call site."

# ---------------------------------------------------------------------------
# [[banned_declaration_keyword]] — keywords from other languages Yinz rejects
# at lex time with a teaching error. Distinct from [[banned_jargon]] (prose).
# Required fields: name, what_instead, why, since
# Note: sized numeric types (f32, f64, i8-i64, u8-u64) and `test` are in
# [[deferred_language_feature]] (Phase 5a) — they ship in a future version.
# ---------------------------------------------------------------------------

# M3 banned
[[banned_declaration_keyword]]
name = "match"
what_instead = "Yinz uses `if (x is Shape)` for type-based branching — no `match` keyword needed."
why = "Type narrowing handles the cases `match` is typically used for, without a separate keyword."
since = "M3"

[[banned_declaration_keyword]]
name = "switch"
what_instead = "Yinz uses `if (x is Shape)` for type-based branching — no `switch` keyword needed."
why = "Type narrowing handles the cases `switch` is typically used for, without a separate keyword."
since = "M3"

# M4 banned OOP declaration keywords
[[banned_declaration_keyword]]
name = "type"
what_instead = "Use `shape` to declare a data type: `shape Player { name: string, health: int }`"
why = "`type` is common in TypeScript, but Yinz uses `shape` — one unambiguous keyword for all data type declarations."
since = "M4"

[[banned_declaration_keyword]]
name = "struct"
what_instead = "Use `shape` to declare a data type: `shape Player { name: string, health: int }`"
why = "Yinz uses `shape` for all data type declarations, whether they would be called structs, classes, or interfaces in other languages."
since = "M4"

[[banned_declaration_keyword]]
name = "class"
what_instead = "Use `shape` for data and standalone functions for behavior: `shape Player { name: string }` then `function greet(share self: Player) -> string`"
why = "Yinz is not object-oriented — there are no classes. Data lives in shapes; behavior lives in standalone functions called via dot-call syntax."
since = "M4"

[[banned_declaration_keyword]]
name = "interface"
what_instead = "For contracts, declare a `shape` with bare method signatures and use `follows`: `shape Damageable { takeDamage(lend self, amount: int) -> nothing }` then `shape Player follows Damageable { ... }`"
why = "Yinz uses `shape` for both data types and contracts. A contract shape holds bare-signature declarations; implementing shapes use the `follows` keyword."
since = "M4"

[[banned_declaration_keyword]]
name = "enum"
what_instead = "Use `options` to declare a set of named values: `options Status { active, inactive, banned }`"
why = "Yinz uses human-readable keywords. `options` immediately signals a set of choices."
since = "M4"

[[banned_declaration_keyword]]
name = "abstract"
what_instead = "Use `base shape` for a shape that cannot be instantiated directly: `base shape Entity { name: string }`"
why = "`base shape` names what the type is before saying it cannot be instantiated — the constraint is part of the declaration, not a separate modifier."
since = "M4"

# M8 banned concurrency keywords
[[banned_declaration_keyword]]
name = "async"
what_instead = "Write `wait foo()` at the call site — no declaration-level annotation needed."
why = "Yinz determines concurrency from the call graph automatically. Functions don't need a special declaration."
since = "M8"

[[banned_declaration_keyword]]
name = "await"
what_instead = "Write `wait foo()` at the call site."
why = "Yinz uses `wait` at the call site — no function-level annotation needed."
since = "M8"

[[banned_declaration_keyword]]
name = "promise"
what_instead = "Yinz has `wait` (force completion) and `background` (run after this function returns). Two keywords cover what other languages use a dozen for."
why = "A `background` task runs when called; use `wait` to force completion. No promise objects needed."
since = "M8"

[[banned_declaration_keyword]]
name = "future"
what_instead = "Yinz has `wait` (force completion) and `background` (run after this function returns). Two keywords cover what other languages use a dozen for."
why = "A `background` task runs when called; use `wait` to force completion. No future objects needed."
since = "M8"

[[banned_declaration_keyword]]
name = "goroutine"
what_instead = "Yinz has `background` for running a function after the current function returns: `background process(data)`."
why = "Use `background foo(arg)` instead. Two keywords (`wait`, `background`) cover what other languages use a dozen for."
since = "M8"

# M8 banned visibility keywords
[[banned_declaration_keyword]]
name = "pub"
what_instead = "Yinz has two visibility states — exported (`export`) or private (default). No `pub`, no `protected`, no modifiers."
why = "Write `export function foo()` to make it visible to other modules. Without `export`, it's private automatically."
since = "M8"

[[banned_declaration_keyword]]
name = "private"
what_instead = "Yinz has two visibility states — exported (`export`) or private (default). Declarations are private unless marked `export`."
why = "Remove `private` — in Yinz, anything without `export` is already private."
since = "M8"

[[banned_declaration_keyword]]
name = "protected"
what_instead = "Yinz has two visibility states — exported (`export`) or private (default). No `pub`, no `protected`, no modifiers."
why = "Remove `protected` — in Yinz, visibility is binary: `export` or private."
since = "M8"

[[banned_declaration_keyword]]
name = "public"
what_instead = "Yinz has two visibility states — exported (`export`) or private (default). Use `export` to make a declaration visible."
why = "Write `export function foo()` instead of `public function foo()`."
since = "M8"

