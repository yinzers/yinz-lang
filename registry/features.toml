substitute = "Users write explicit param types on named functions. No lambda surface exists in v0.1."
why = "The canonical use-case for function_param_type hints is `foo(x => x + 1)` where `x` type is inferred from `foo`'s expected parameter type. Yinz v0.1 has no lambda syntax. The M5 LSP protocol handler emits no hints until lambdas land."
