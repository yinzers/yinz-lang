[package]
name = "ynz-driver"
description = "The ynz compiler CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ynz"
path = "src/main.rs"

[dependencies]
clap            = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
tempfile        = { workspace = true }
ynz-diagnostics = { workspace = true }
ynz-ast         = { workspace = true }
ynz-parser      = { workspace = true }
ynz-typeck      = { workspace = true }
ynz-codegen     = { workspace = true }
ynz-fmt         = { workspace = true }
ynz-watch       = { workspace = true }

# Signal-name lookup for `ynz run`'s signal-terminated-child report (Unix only —
# ExitStatusExt::signal() is a Unix-only API; see run.rs for the Windows fallback).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }

[dev-dependencies]
insta      = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
tempfile   = { workspace = true }
criterion  = { workspace = true }

[[bench]]
name = "soa_calibration"
harness = false

