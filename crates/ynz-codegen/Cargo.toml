[package]
name = "ynz-codegen"
description = "LLVM code generation for the ynz compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
inkwell         = { workspace = true }
salsa           = { workspace = true }
ynz-diagnostics = { workspace = true }
ynz-ast         = { workspace = true }
ynz-numerics    = { path = "../ynz-numerics" }
ynz-parser      = { workspace = true }
ynz-typeck      = { workspace = true }
ynz-registry    = { workspace = true }
# Shared frame-ABI constants only (spike discriminator tag + handle base offset). The
# compile-time assertion in emit.rs binds codegen's FRAME_HEADER_SIZE to the runtime's
# handle-region base via these constants — a header-size drift becomes a COMPILE ERROR,
# not silent heap corruption. ynz-abi is dependency-free, so the runtime's tokio tree
# stays OUT of the compiler's dependency graph.
ynz-abi         = { workspace = true }

[dev-dependencies]
insta    = { workspace = true }
inkwell  = { workspace = true }
