[package]
name = "ynz-lsp"
description = "Yinz Language Server — JSON-RPC stdio server backed by salsa queries"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
lsp-server = "0.7.9"
lsp-types = "0.95"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "ynz-lsp"
path = "src/main.rs"
