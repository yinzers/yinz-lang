[package]
name = "ynz-lsp"
description = "Yinz Language Server — JSON-RPC stdio server backed by salsa queries"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
lsp-server = "0.7.9"
lsp-types = "0.95"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"

salsa           = { workspace = true }
ynz-fmt         = { workspace = true }
ynz-parser      = { workspace = true }
ynz-typeck      = { workspace = true }
ynz-diagnostics = { workspace = true }
ynz-registry    = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "ynz-lsp"
path = "src/main.rs"
