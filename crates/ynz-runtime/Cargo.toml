[package]
name = "ynz-runtime"
description = "C-ABI runtime shims for Yinz-compiled binaries — panic handlers, decimal128 bridge, int/float formatting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

# staticlib: produces libynz_rt.a for linking into Yinz-compiled binaries.
# rlib:      lets ynz-driver (build.rs) query the archive path at compile time.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ynz-numerics = { workspace = true }
ynz-abi = { workspace = true }
simdutf8 = "=0.1.4"
unicode-normalization = "=0.1.24"
memchr = "=2.7.4"
unicase = "=2.7.0"
unicode-segmentation = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
num_cpus = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Loom model-checking substrate (v0.3-M8 Phase 3). Reachable ONLY when rustc is invoked with
# `--cfg loom` (RUSTFLAGS='--cfg loom'); a plain `cargo build`/`cargo test` never resolves,
# downloads, or links it — zero production dependency. Under `cfg(loom)` the `crate::sync`
# shim re-exports loom's `Arc`/`Mutex`/`thread_local!` in place of std's so loom can
# exhaustively schedule the runtime-owned channel synchronization state (see src/sync.rs).
[target.'cfg(loom)'.dependencies]
loom = "=0.7.2"

# `cfg(loom)` is set by RUSTFLAGS, not by a Cargo feature — declare it so rustc's check-cfg
# lint knows it is intentional (otherwise every `#[cfg(loom)]` warns, and clippy -D warnings
# would fail the workspace).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
