services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: ynz-dev
    volumes:
      # Bind-mount the whole project so cargo writes target/ onto the host.
      # trading-v4 mounts the host ynz/target/release to reach the built binary,
      # so target/ must stay inside this bind mount — never in a named volume.
      - .:/work
      # Named volume for the cargo registry so downloaded crates survive rebuilds.
      # Matched to the ubuntu user's CARGO_HOME location (rustup default: ~/.cargo).
      - cargo-registry:/home/ubuntu/.cargo/registry
    working_dir: /work
    command: ["sleep", "infinity"]
    # `/tmp` in RAM, not on the host disk. `ynz run` builds every program into a
    # per-invocation temp directory (`tempfile::tempdir()`, see crates/ynz-driver/src/run.rs)
    # — object file, linked binary — executes it once, then deletes it. Those artifacts are
    # ephemeral by construction and have no reason to reach physical storage.
    #
    # WHY it matters, measured 2026-09-02 on the corpus sweep
    # (crates/ynz-driver/tests/cross_impl_consistency.rs, ~3,342 compile+link+execute cycles):
    # serially the full workspace suite pushed ~155GB of writes and spent 2,291s in that one
    # test file. Parallelizing the sweep moved the bottleneck straight off the CPU and onto the
    # disk — 81% iowait, 385ms write latency, `sda` at 89% utilization, 34 processes parked in
    # D-state. More workers cannot fix that; they only deepen the queue. Routing the transient
    # build artifacts to tmpfs removes the write stream instead of scheduling around it.
    #
    # SIZE: 8g against 62GB of host RAM. Artifacts are deleted per invocation, so this caps
    # concurrent-in-flight build output, not cumulative churn. A tmpfs that fills returns
    # ENOSPC rather than spilling, so this is deliberately generous.
    #
    # NOT for `target/`: that stays on the `.:/work` bind mount above — external projects
    # (trading-v4 et al.) read `target/release` from the host, and a RAM-backed target/ would
    # both vanish on container exit and blow past this size cap.
    # `exec` is REQUIRED and is not the default: Docker mounts tmpfs `noexec`, and `ynz run`
    # does exactly the thing `noexec` forbids — it links a binary into this directory and then
    # executes it. Without `exec` every driver test that runs a fixture dies with EACCES/
    # "Permission denied" at spawn, before a single assertion evaluates. Verified live here,
    # not inferred: a compiled binary was executed from this mount as part of adding it.
    tmpfs:
      - /tmp:size=8g,mode=1777,exec
    # ThreadSanitizer (v0.3-M6 Phase 6b) tries to lower its own ASLR entropy via
    # personality(ADDR_NO_RANDOMIZE) on every run — Docker's default seccomp profile denies
    # that EXACT syscall+argument combination, which aborts EVERY TSan-instrumented binary
    # with "FATAL: ThreadSanitizer: encountered an incompatible memory layout but was unable
    # to disable ASLR" before any test runs. `./docker/tsan-seccomp.json` is Docker's own
    # default profile (github.com/moby/profiles/seccomp/default.json — the file `daemon/
    # seccomp_linux.go` actually loads) with exactly ONE line added: an `SCMP_ACT_ALLOW`
    # rule for `personality` with arg value 262144 (0x40000 == ADDR_NO_RANDOMIZE) — the
    # default profile already allow-lists `personality` for 5 OTHER argument values (0, 8,
    # 131072, 131080, 0xffffffff) but not this one, which is why TSan specifically (and
    # only) needs this addition. `security_opt: seccomp:unconfined` (Docker's own +
    # LLVM/Clang sanitizer docs' quick-fix) was replaced by this narrower profile (M6
    # Phase 6b fix-loop) — `unconfined` disabled Docker's ENTIRE default filter (~40
    # blocked syscalls including mount, pivot_root, keyctl, init_module, kexec_load,
    # perf_event_open, userfaultfd, unrestricted clone/unshare), a needlessly wide attack
    # surface for a container that routinely runs untrusted crates.io build scripts/
    # proc-macros. This narrower profile was verified live against a real TSan run
    # (verified live during this phase's fix-loop round, twice: once catching a real
    # container-drift gap, once as part of the final full-suite re-verification) — not
    # assumed correct from profile inspection alone.
    # `cap_add: SYS_PTRACE` is NOT needed for personality(2) specifically (not gated by
    # CAP_SYS_PTRACE at all) — it is required for TSan's symbolizer, which reads
    # /proc/<pid>/maps and /proc/<pid>/stat of OTHER processes for stack traces; ptrace
    # capability governs that /proc access. Kept, now with a reason recorded here instead
    # of an unexplained line.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:./docker/tsan-seccomp.json

volumes:
  cargo-registry:
