# cargo-nextest configuration. Only the `ci` profile is used by CI (see
# .github/workflows/ci.yml, job `nextest-test`); the default profile is nextest's own.
#
# Timeouts here are for LIVENESS only (kill a hung test), never performance: a test sharing
# cores with hundreds of siblings cannot measure speed. `period` x `terminate-after` is the
# hard ceiling per test.

[profile.ci]
# Report every failure, not just the first: a CI run must show the whole red set.
fail-fast = false
# Flag a test SLOW every 10 min, kill it after 2 h (12 x 10 min). Spike S1 measured two
# `ynz-driver::cross_impl_consistency` corpus sweeps at 6 to 13 min each under load, so the
# ceiling is about 10x the slowest observed test. It only catches deadlocks.
slow-timeout = { period = "600s", terminate-after = 12 }

[profile.ci.junit]
# Written to target/nextest/ci/junit.xml; uploaded as an artifact by the CI job.
path = "junit.xml"
