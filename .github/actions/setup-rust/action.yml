name: Set up Rust and the cargo cache
description: >-
  Installs the pinned Rust toolchain and restores ~/.cargo plus target/ for one lane. Every
  job names its own cache so a lane's build profile never evicts another lane's.

inputs:
  toolchain:
    description: Exact toolchain. Bump on purpose; a moving "stable" changes a build between two runs.
    required: false
    default: "1.100.0"
  components:
    description: Comma-separated rustup components.
    required: false
    default: ""
  cache-name:
    description: Cache name, unique per lane.
    required: true
  cache:
    description: "'false' skips the cache, for a job that only runs prebuilt test binaries."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    # rust-toolchain.toml says `channel = "stable"`, and rustup would honour it over the default
    # the step above installed. RUSTUP_TOOLCHAIN outranks that file, so the pin holds.
    - name: Pin the toolchain over rust-toolchain.toml
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: echo "RUSTUP_TOOLCHAIN=${TOOLCHAIN}" >> "$GITHUB_ENV"

    - name: Restore cargo registry and target/
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ inputs.cache-name }}-${{ inputs.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
