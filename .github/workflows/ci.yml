name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The two corpus sweeps of ynz-driver (nextest filterset). `test` leaves them out, `sweep` runs them.
  SWEEP_TESTS: binary(cross_impl_consistency) & (test(=corpus_byte_identical_across_mode_matrix) | test(=corpus_produces_deterministic_output_across_runs))

# Least-privilege GITHUB_TOKEN for every job in this workflow: no job needs anything beyond
# read-only repo access (checkout, plus actions/cache and the artifact actions, which
# authenticate with the runtime token, not GITHUB_TOKEN). No PR comments, no releases, no pushes.
# Workflow-level so it covers every job without duplicating the block per job.
permissions:
  contents: read

# Lane layout (plan #19, card #681). Every job is its own required check and none has a path
# filter. Jobs run in parallel on free `ubuntu-24.04` runners (4 vCPU):
#   lint            fmt + clippy
#   release         release build + Loom
#   archive         builds every test binary once, archives them, checks the test count
#   test            the archived tests, split over N runners by `cargo nextest --partition`
#   fuzz            generated-corpus mode matrix (non-blocking, see below)
#   miri            Miri, one runner per ynz-runtime test target
#   sanitizers      ThreadSanitizer and AddressSanitizer
# Third-party actions are pinned to a commit SHA, the toolchains to an exact version, and the
# runner image to a release, so a build today equals a build tomorrow.

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install LLVM 18
        uses: ./.github/actions/install-apt
        with:
          packages: llvm-18 llvm-18-dev libclang-18-dev clang-18

      - name: Point the build at LLVM 18
        run: echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-name: lint

      - name: Check formatting
        run: cargo fmt --check

      # ynz-driver and ynz-watch embed the runtime static archive at compile time via
      # `include_bytes!(env!("YNZ_RT_LIB_PATH"))` (target/debug/libynz_runtime.a). `cargo
      # clippy`/`cargo check` are check-only and never produce that archive, so on a clean
      # checkout Clippy fails with "couldn't read libynz_runtime.a". A real `cargo build` of
      # ynz-runtime emits the staticlib first.
      - name: Build runtime archive (required by include_bytes! in driver/watch)
        run: cargo build -p ynz-runtime

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  release:
    name: Release build + Loom
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install LLVM 18
        uses: ./.github/actions/install-apt
        with:
          packages: llvm-18 llvm-18-dev libclang-18-dev clang-18

      - name: Point the build at LLVM 18
        run: echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-name: release

      # Pre-build the release-profile runtime staticlib first, for the same reason as the debug
      # step in `lint`: `cargo build --workspace --release` can compile the embedding consumers
      # (driver/watch) before ynz-runtime emits target/release/libynz_runtime.a, since the
      # include_bytes! dependency is invisible to cargo's unit graph.
      - name: Build (release)
        run: |
          cargo build -p ynz-runtime --release
          cargo build --workspace --release

      # Loom model-checking harness (v0.3-M8 Phase 3). `--cfg loom` swaps ynz-runtime's
      # `crate::sync` primitives to loom's and compiles `src/loom_tests.rs`; nothing else in the
      # workspace observes the cfg (tokio gates its own loom paths on `all(test, loom)`, never
      # true for a dependency). Own target dir so the cfg'd rebuild never invalidates the main
      # cache. Unbounded (exhaustive) on purpose — the whole lane is ~2s; `LOOM_MAX_PREEMPTIONS`
      # is a local bisecting knob, not a CI setting: every model completes exhaustively
      # unbounded, and a preemption bound only PRUNES schedules from that same exploration, so
      # a bounded run explores a strict subset of what this step already covers. The trailing
      # grep is a vacuity guard: a drifted `loom_` filter would otherwise "pass" by matching
      # zero tests.
      #
      # `pipefail` is load-bearing: without it the `tee` pipe discarded cargo's exit status and
      # the grep was the accidental sole failure gate (a crashed lane with a stale "ok" line
      # would have passed). Patrick ruled 2026-09-03 that this lane stays BLOCKING — no
      # `continue-on-error`.
      - name: Loom (ynz-runtime model-checking harness, --cfg loom)
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS='--cfg loom' CARGO_TARGET_DIR=target/loom \
            cargo test -p ynz-runtime --release --lib -- loom_ --nocapture 2>&1 | tee loom.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' loom.log

      - name: Verify --version
        run: ./target/release/ynz --version

  # Builds every test binary once and archives them; `test` and `sweep` run it.
  archive:
    name: Build and archive the tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install LLVM 18
        uses: ./.github/actions/install-apt
        with:
          packages: llvm-18 llvm-18-dev libclang-18-dev clang-18

      - name: Point the build at LLVM 18
        run: echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-name: archive

      - name: Install cargo-nextest
        uses: ./.github/actions/install-nextest

      # Same reason as in `lint`: driver/watch include_bytes! the runtime staticlib.
      - name: Build runtime archive (required by include_bytes! in driver/watch)
        run: cargo build -p ynz-runtime

      # `--profile ci` adds target/debug/libynz_runtime.a to the archive (see
      # .config/nextest.toml): the ASan harness links it into programs at test run time.
      - name: Archive the test binaries
        run: cargo nextest archive --workspace --profile ci --archive-file nextest-archive.tar.zst

      # Exit check: nextest must run at least as many tests as `cargo test --workspace`. Both
      # sides leave out the nightly lane (names starting `nightly_`): the ci profile's
      # default-filter does it for nextest, the grep for `cargo test`. Ignored tests count on
      # both sides (`--run-ignored all`); `cargo test -- --list` prints them too.
      - name: Count tests, nextest against cargo test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace -- --list 2> /dev/null > cargo-test-list.txt
          cargo_test_count="$(grep -E ': test$' cargo-test-list.txt | grep -Evc '(^|::)nightly_' || true)"
          cargo nextest list --workspace --profile ci --run-ignored all --message-format oneline > nextest-list.txt
          nextest_count="$(wc -l < nextest-list.txt)"
          echo "cargo test --workspace -- --list (without nightly_): ${cargo_test_count}"
          echo "cargo nextest list --workspace --profile ci --run-ignored all: ${nextest_count}"
          echo "::notice title=test count::cargo test --workspace -- --list without nightly_: ${cargo_test_count}; cargo nextest list --profile ci --run-ignored all: ${nextest_count}"
          if [ "${nextest_count}" -lt "${cargo_test_count}" ]; then
            echo "::error::nextest lists fewer tests (${nextest_count}) than cargo test (${cargo_test_count})"
            exit 1
          fi

      - name: Upload the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          # The archive is already zstd-compressed; re-zipping it costs time for nothing.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Everything except the two corpus sweeps, split over N runners. The sweeps are single tests of
  # 5-7 min alone on a runner but 9-25 min when they share one with a partition (spike #676,
  # run 45300415355: 1494 s under load, 284-300 s alone), and nextest cannot split one test, so
  # they run in `sweep` below. If a sweep is renamed, `sweep` fails with "no tests to run"
  # instead of the sweep silently going back into a partition.
  test:
    name: Tests, partition ${{ matrix.partition }}/4
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # N = 4 here and in `--partition count:<i>/4` below: keep the two in step.
        partition: [1, 2, 3, 4]
    steps:
      # Checkout is still needed: tests read fixtures and sources through paths remapped to
      # the workspace (`--workspace-remap .`).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare the runner
        uses: ./.github/actions/prepare-test-runner

      - name: Start resource sampling
        run: .github/scripts/resources.sh start

      # `--extract-to .` puts the archive's target/ back at <checkout>/target, the same absolute
      # path the archive job built at. Some tests read files by a path baked in at compile time
      # (YNZ_RT_LIB_PATH = <checkout>/target/debug/libynz_runtime.a), which a temp-dir extract
      # would leave empty. `--failure-output immediate-final` prints a failing test's output in
      # this job's log, where the log reader needs it.
      - name: Run partition
        run: |
          start_seconds="${SECONDS}"
          cargo nextest run --archive-file nextest-archive.tar.zst --extract-to . --extract-overwrite \
            --workspace-remap . --partition count:${{ matrix.partition }}/4 --profile ci \
            --failure-output immediate-final -E 'not (${{ env.SWEEP_TESTS }})'
          echo "::notice title=partition wall clock::partition ${{ matrix.partition }}/4: $(( SECONDS - start_seconds )) s (extract + run)"

      - name: Resource summary
        if: always()
        run: .github/scripts/resources.sh summary

      - name: Slowest tests and binaries
        if: always()
        run: .github/scripts/slowest-tests.sh target/nextest/ci/junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-junit-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  # The two corpus sweeps, one runner each (see `test` above). Keep the matrix names in step with
  # SWEEP_TESTS. /tmp is a tmpfs here (prepare-test-runner): the sweeps write and link a 53 MB
  # runtime library per program, and on a slow runner disk they spent 55% of their time in iowait.
  sweep:
    name: Sweep ${{ matrix.test }}
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        test:
          - corpus_byte_identical_across_mode_matrix
          - corpus_produces_deterministic_output_across_runs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare the runner
        uses: ./.github/actions/prepare-test-runner

      - name: Start resource sampling
        run: .github/scripts/resources.sh start

      - name: Run the sweep
        run: |
          start_seconds="${SECONDS}"
          cargo nextest run --archive-file nextest-archive.tar.zst --extract-to . --extract-overwrite \
            --workspace-remap . --profile ci --failure-output immediate-final \
            -E 'binary(cross_impl_consistency) & test(=${{ matrix.test }})'
          echo "::notice title=sweep wall clock::${{ matrix.test }}: $(( SECONDS - start_seconds )) s (extract + run)"

      - name: Resource summary
        if: always()
        run: .github/scripts/resources.sh summary

  fuzz:
    name: Structured fuzzing lane (generated .ynz corpus × mode matrix)
    runs-on: ubuntu-24.04
    # NON-BLOCKING on first landing, by v0.3-M8 Phase 8 step 4's design. A genuine finding here
    # routes through the plan-amendment/FRAGO seam (risk R5), not an immediate red build, until
    # the lane has proven it does not flake.
    #
    # PROMOTE-TO-BLOCKING TRIGGER (delete this flag and the two lines above when it fires):
    # thirty consecutive CI runs of this job with zero findings AND zero TIMED OUT reports. At
    # that point a finding is evidence about the compiler rather than about the harness, and a
    # non-blocking lane nobody reads is worse than no lane.
    continue-on-error: true
    # Hard wall-clock ceiling on the whole job — the "never open-ended, never AFL-style
    # continuous fuzzing" requirement, enforced by the runner rather than trusted to the corpus
    # size. Measured: 64 programs × 4 modes = 14.5s on a 16-core dev container; the corpus size
    # below is fixed at 96 and the rest of this budget is build time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install LLVM 18
        uses: ./.github/actions/install-apt
        with:
          packages: llvm-18 llvm-18-dev libclang-18-dev clang-18

      - name: Point the build at LLVM 18
        run: echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-name: fuzz

      # Same reason as in `lint`: ynz-driver embeds the runtime staticlib via include_bytes!,
      # which a check-only invocation never produces.
      - name: Build runtime archive (required by include_bytes! in driver)
        run: cargo build -p ynz-runtime

      # BOUNDED BY CONSTRUCTION: a fixed corpus of 96 generated programs, each run across the
      # 2×2 compilation-mode matrix, with a per-invocation liveness kill in the harness
      # (FUZZ_RUN_BUDGET, 90s) and the job-level timeout-minutes above. Nothing here is
      # open-ended.
      #
      # The seed base is the run id, so every CI run explores a DIFFERENT, fully reproducible
      # slice: the harness prints the seed base, and each generated file carries its own seed in
      # its name and its header comment. Replay locally with
      #   YNZ_FUZZ_SEED=<seed> cargo test -p ynz-driver --test cross_impl_consistency \
      #     print_generated_program -- --ignored --nocapture
      #
      # `pipefail` is load-bearing for the same reason it is in the Loom step: without it the
      # `tee` pipe would swallow cargo's exit status and the greps would become the sole gate.
      #
      # The three greps are the VACUITY GUARD. A lane that generated zero programs, compiled
      # zero of them, or matched zero tests must FAIL, not pass quietly — that is the exact
      # green-rot shape the Loom step's own grep exists to catch. (`continue-on-error` above
      # means a failure is reported, not fatal — that is the non-blocking policy, not an excuse
      # to skip the guard.)
      - name: Structured fuzzing (96 generated programs × 4 compilation modes)
        shell: bash
        env:
          YNZ_FUZZ_PROGRAMS: "96"
          YNZ_FUZZ_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cargo test -p ynz-driver --test cross_impl_consistency \
            generated_corpus_byte_identical_across_mode_matrix -- --nocapture 2>&1 | tee fuzz.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' fuzz.log
          grep -Eq 'fuzz corpus: .* [1-9][0-9]* generated \([1-9][0-9]* distinct' fuzz.log
          grep -Eq '[1-9][0-9]* compiled and ran to exit 0' fuzz.log

      - name: Upload fuzz.log on failure (the summary + embedded finding sources)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-log
          path: fuzz.log
          if-no-files-found: warn

      # The README presents the KEPT scratch directory as the durable replay artifact (full,
      # untruncated per-mode stdout/stderr capture files — fuzz.log above only carries the
      # panic message's truncated 600/1600-byte excerpts). `generated_corpus_byte_identical_
      # across_mode_matrix` calls `tempfile::Builder::new().prefix("ynz-fuzz-").tempdir()` with
      # no `tempdir_in`, so it lands in the OS temp dir — `/tmp` on this runner — and `dir.keep()`
      # on failure leaves it there rather than deleting it. Upload it too, so the README's own
      # claim and what CI actually keeps agree.
      - name: Upload kept fuzz corpus on failure (full per-mode capture files, replay input)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-corpus
          path: /tmp/ynz-fuzz-*
          if-no-files-found: warn

  # One Miri runner per ynz-runtime test target. The matrix comes from `cargo metadata`, so a
  # new test file is picked up without editing this workflow and cannot be left out silently.
  # Same test set as the former single `cargo miri test -p ynz-runtime`, which ran the lib and
  # every integration-test file (the doctest count is zero, see the TSan note below).
  miri-plan:
    name: Miri plan (one job per ynz-runtime test target)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-name: none
          cache: "false"

      - name: List the test targets
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          targets="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -c '[.packages[] | select(.name == "ynz-runtime") | .targets[]
                      | select(.test == true)
                      | if (.kind | index("test")) then {flag: "--test \(.name)", name: .name}
                        elif (.kind | index("bin")) then {flag: "--bin \(.name)", name: .name}
                        else {flag: "--lib", name: "lib"} end]')"
          echo "${targets}"
          if [ "$(echo "${targets}" | jq length)" -lt 2 ]; then
            echo "::error::expected the lib and at least one integration test, got: ${targets}"
            exit 1
          fi
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

  miri:
    name: Miri, ${{ matrix.target.name }}
    needs: miri-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.miri-plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust nightly (rust-src + miri)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly-2026-11-20
          components: rust-src, miri
          cache-name: miri

      # Miri — single atomic invocation per target, zero MIRIFLAGS. The files with
      # fs::read_to_string source-text audits and the pure wall-clock/ns-per-call benchmarks are
      # individually `#[cfg_attr(miri, ignore = "...")]`-gated in source with cited reasons —
      # nothing is silently skipped here. The nightly lane (`nightly_` tests: wall-clock and
      # soak tests) is left out: timing is meaningless under Miri's interpreter, and one of them
      # alone ran over 20 minutes there. The `also_skip` line is an old-name skip of a test that
      # lane 7 (#687) renames to `nightly_...`; delete it when that rename lands on main (the
      # #689 integration merge).
      - name: Miri (ynz-runtime ${{ matrix.target.flag }})
        shell: bash
        run: |
          set -euo pipefail
          also_skip=(--skip string_map_build_plus_lookup_stays_within_constant_factor_of_int_map)
          cargo miri test -p ynz-runtime ${{ matrix.target.flag }} -- \
            --skip nightly_ "${also_skip[@]}" 2>&1 | tee miri.log
          .github/scripts/sum-test-results.sh miri.log

  sanitizers:
    name: Sanitizers (TSan / ASan) — ynz-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust nightly (rust-src)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly-2026-11-20
          components: rust-src
          cache-name: sanitizers

      # Sanitizer stack traces are unreadable raw addresses without a symbolizer (confirmed
      # locally, M6 Phase 6b — the dev container needed ASAN_SYMBOLIZER_PATH pointed at
      # llvm-symbolizer-18 explicitly).
      - name: Install llvm-symbolizer (readable sanitizer stack traces)
        uses: ./.github/actions/install-apt
        with:
          packages: llvm-18
          recommends: "false"

      - name: Point the sanitizers at the symbolizer
        run: |
          symbolizer="/usr/lib/llvm-18/bin/llvm-symbolizer"
          test -x "${symbolizer}"
          echo "ASAN_SYMBOLIZER_PATH=${symbolizer}" >> "$GITHUB_ENV"
          echo "TSAN_SYMBOLIZER_PATH=${symbolizer}" >> "$GITHUB_ENV"

      # ThreadSanitizer — confirmed-working invocation, M6 Phase 6b. `--lib --tests` (no
      # `--doc`) because rustdoc's own driver doesn't forward `-Zsanitizer` the same way
      # `cargo test` does and errors with an ABI-mismatch against several dependency crates
      # (a documented rustc/rustdoc limitation, not a finding in our code) — moot in
      # practice since ynz-runtime ships zero actual doctests.
      #
      # GitHub-hosted runners are unrestricted VMs, not seccomp-locked containers, so TSan
      # needs no ptrace/seccomp workaround here (docker-compose.yml has one for the dev
      # container). If this step ever aborts with "unable to disable ASLR (perhaps sandboxing
      # is enabled?)", investigate a runner-level seccomp/ptrace restriction.
      - name: ThreadSanitizer (ynz-runtime, lib + integration tests, excl. doctests)
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS='-Zsanitizer=thread' cargo test -p ynz-runtime \
            --target x86_64-unknown-linux-gnu -Zbuild-std --lib --tests 2>&1 | tee tsan.log
          .github/scripts/sum-test-results.sh tsan.log

      # AddressSanitizer — confirmed-working invocation, M6 Phase 6b. `--doc` is excluded here
      # too for parity with the TSan step (0 doctests either way).
      - name: AddressSanitizer (ynz-runtime, lib + integration tests, excl. doctests)
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS='-Zsanitizer=address' cargo test -p ynz-runtime \
            --target x86_64-unknown-linux-gnu -Zbuild-std --lib --tests 2>&1 | tee asan.log
          .github/scripts/sum-test-results.sh asan.log
